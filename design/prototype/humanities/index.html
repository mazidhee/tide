<!doctype html>
<html lang="en-GB" data-theme="light" data-design="tide">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Tide · Reading in the humanities: harness</title>
<!--
  The EPUB reader, "Discuss this" and reading together outside Electron, drawn by the app's own
  components and styles with a stand-in for window.tide (harness.tsx).
  Build and shoot:  ./shoot.sh
  Open:   index.html?scene=epub&theme=light
          scene: epub (reader + a discussion beside a highlighted paragraph)  together (read together)
                 pdf (a PDF page + the discussion in its side pane)  notes (the book's notes page)
          theme: light dark (or any of the app's themes)   design=classic for the old design
-->
<link rel="stylesheet" href="../../../node_modules/@fontsource-variable/inter/index.css" />
<link rel="stylesheet" href="../../../node_modules/@fontsource-variable/source-serif-4/index.css" />
<link rel="stylesheet" href="../../../node_modules/@fontsource-variable/jetbrains-mono/index.css" />
<link rel="stylesheet" href="../../../node_modules/katex/dist/katex.min.css" />
<link rel="stylesheet" href="../../../src/renderer/src/styles/theme.css" />
<link rel="stylesheet" href="../../../src/renderer/src/styles/app.css" />
<link rel="stylesheet" href="../../../src/renderer/src/styles/prose.css" />
<link rel="stylesheet" href="../../../src/renderer/src/styles/tide/fonts.css" />
<link rel="stylesheet" href="../../../src/renderer/src/styles/tide/tokens.css" />
<link rel="stylesheet" href="../../../src/renderer/src/styles/tide/base.css" />
<link rel="stylesheet" href="../../../src/renderer/src/styles/tide/shell.css" />
<link rel="stylesheet" href="../../../src/renderer/src/styles/tide/lesson.css" />
<link rel="stylesheet" href="../../../src/renderer/src/styles/reading.css" />
<link rel="stylesheet" href="../../../src/renderer/src/styles/tide/reading.css" />
<link rel="stylesheet" href="../../../src/renderer/src/styles/tide/notes.css" />
<link rel="stylesheet" href="../../../src/renderer/src/styles/tide/library.css" />
<link rel="stylesheet" href="../../../src/renderer/src/styles/tide/rest.css" />
<link rel="stylesheet" href="../../../src/renderer/src/styles/humanities.css" />
<style>
  html, body, #root { height: 100%; margin: 0; }
  body { background: var(--paper, var(--bg)); }
  /* The PDF page, drawn as text: pdf.js isn't mounted here */
  .hx-page { position: relative; width: 600px; min-height: 780px; margin: 24px auto; padding: 64px 70px; box-sizing: border-box; background: #fffdf8; color: #222; box-shadow: 0 1px 3px rgba(0,0,0,.18); font: 15px/1.6 'Source Serif 4 Variable', Georgia, serif; }
  :root[data-theme='dark'] .hx-page, :root[data-theme='midnight'] .hx-page { background: #f4f1ea; }
  .hx-page p { margin: 0 0 0.9em; text-align: justify; hyphens: auto; }
  .hx-page-head { text-align: center !important; font-variant: small-caps; letter-spacing: .04em; margin-bottom: 1.4em !important; }
  .hx-hl { mix-blend-mode: multiply; border-radius: 2px; }
  .hx-folio { position: absolute; bottom: 30px; left: 0; right: 0; text-align: center; font-size: 12px; color: #777; }
</style>
</head>
<body>
<div id="root"></div>
<script src="harness.js"></script>
</body>
</html>
