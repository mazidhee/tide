[package]
name = "tide-core"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
napi = { version = "2", default-features = false, features = ["napi6", "serde-json"] }
napi-derive = "2"
tantivy = "0.24"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.37", features = ["bundled", "hooks", "limits", "column_decltype"] }

[build-dependencies]
napi-build = "2"

[profile.release]
lto = true
codegen-units = 1
opt-level = 3
strip = true

# For the retrieval evaluation (examples/retrieval) and the tests only: none of it is in the module
[dev-dependencies]
libc = "0.2"
memmap2 = "0.9"
tempfile = "3"
unicode-normalization = "0.1"
unicode_categories = "0.1"
# To check that the evaluation's own WordPiece tokeniser agrees with the reference one
tokenizers = { version = "0.21", default-features = false, features = ["fancy-regex"] }
